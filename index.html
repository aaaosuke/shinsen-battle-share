<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>真戦 戦闘ログ共有</title><link rel="stylesheet" href="/style.css"></head><body>
<header><h1>⚔️ 真戦 戦闘ログ共有</h1><p>戦闘スクショを保存・共有するためのサイト</p></header><main>
<section class="panel"><h2>画像をアップロード</h2><form id="form"><div class="grid"><label>戦闘ID<input name="battleId" placeholder="例：顕如テスト001"></label><label>種類<select name="category"><option>戦報</option><option>通常攻撃</option><option>戦法</option><option>ダメージ</option><option>編成</option><option>その他</option></select></label></div><label>メモ<textarea name="note" placeholder="例：通常攻撃ダメージ確認"></textarea></label><label class="drop"><input id="images" name="images" type="file" accept="image/*" multiple required><b>📷 画像を選択</b><span id="count">未選択</span></label><button>アップロード</button></form><div id="result"></div></section>
<section class="panel"><div class="toolbar"><h2>共有ギャラリー</h2><div><input id="search" placeholder="検索"><a href="/api/export">JSON出力</a></div></div><div id="gallery" class="gallery"></div></section></main>
<script src="/app.js"></script></body></html>
